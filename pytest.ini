[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Tests in tests/integration/ require real CLI binaries (codex, claude,
# opencode) and optionally a real vLLM endpoint. They are excluded from
# the default (daily) pytest run via the `real_cli` marker. Run with
# `pytest -m real_cli` (weekly cadence) to include them — individual
# tests still skip unless AGENTSURGE_E2E_FRONTENDS=1 (and, for the
# multi-session smoke, AGENTSURGE_E2E_VLLM_* env vars) are set.
#
# Note: the unrelated `e2e` marker used elsewhere in tests/core/ is for
# heavy-but-hermetic tests and is intentionally NOT excluded here.
addopts = -m "not real_cli"
filterwarnings =
    error
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    real_cli: requires real codex/claude/opencode binary; excluded from default pytest runs (run with -m real_cli, set AGENTSURGE_E2E_FRONTENDS=1)
    e2e: heavy-but-hermetic end-to-end pipeline tests (already in the daily run; do not gate on this)
