name: Capacity Tests

# Runs tests/capacity/ independently from the main test suite.
# Triggered separately to keep the main workflow scoped while still reporting
# capacity failures as normal CI failures.

on:
  push:
    branches: [master, main, "feature/*"]
    paths:
      - "agentsurge/capacity/**"
      - "tests/capacity/**"
      - ".github/workflows/capacity.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "agentsurge/capacity/**"
      - "tests/capacity/**"
      - ".github/workflows/capacity.yml"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to test against (leave blank for all)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capacity-tests:
    name: "Capacity Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install agentsurge[capacity] + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[capacity]"
          pip install pytest pytest-asyncio

      - name: Run capacity test suite
        run: |
          pytest tests/capacity/ -v --tb=short \
            -p no:cacheprovider \
            --override-ini="asyncio_mode=auto"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7
