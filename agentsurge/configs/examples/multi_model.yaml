# Multi-model configuration example
# Demonstrates how to define multiple models for sweep/compare workflows.
#
# Usage:
#   agentsurge sweep --config configs/examples/multi_model.yaml

vllm:
  url: "http://localhost:8000"
  model: "llama-70b"
  timeout: 600

runner:
  max_concurrency: 50
  max_tokens: 512
  arrival_pattern: "poisson"

models:
  llama-70b:
    display_name: "Llama-3.3-70B-Instruct"
    architecture: "GQA"
    max_model_len: 16384
    name: "llama-70b"
    num_hidden_layers: 80
    num_attention_heads: 64
    num_key_value_heads: 8
    head_dim: 128
    kv_dtype_bytes: 2
    tp_size: 4
    num_gpus: 4
    hbm_per_gpu_gb: 80.0
  llama-8b:
    display_name: "Llama-3.1-8B-Instruct"
    architecture: "GQA"
    max_model_len: 32768
    name: "llama-8b"
    num_hidden_layers: 32
    num_attention_heads: 32
    num_key_value_heads: 8
    head_dim: 128
    kv_dtype_bytes: 2
    tp_size: 1
    num_gpus: 1
    hbm_per_gpu_gb: 80.0
