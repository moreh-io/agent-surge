[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsurge"
version = "0.1.0"
description = "Benchmark your LLM server with realistic coding agent workloads"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "agentsurge contributors"}]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
run = [
    "transformers>=4.30.0",
]
fast = [
    "orjson>=3.9.0",
]
openai = [
    "openai>=1.0.0",
]
analysis = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
capacity = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
hf = [
    "huggingface_hub>=0.20.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]
all = [
    "agentsurge[run,fast,openai,analysis,capacity,hf]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.5",
]

[project.scripts]
agentsurge = "agentsurge.cli:main"

[project.urls]
Homepage = "https://github.com/moreh-io/agent-surge"
Repository = "https://github.com/moreh-io/agent-surge"
Issues = "https://github.com/moreh-io/agent-surge/issues"

[tool.setuptools.packages.find]
include = ["agentsurge*"]

[tool.setuptools.package-data]
agentsurge = ["py.typed", "data/*.json", "configs/*.yaml", "configs/examples/*.yaml"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20", "C4"]
ignore = ["E501", "SIM102", "SIM108", "SIM117", "SIM910", "B905", "C408"]

[tool.ruff.lint.per-file-ignores]
"agentsurge/cli/_slo_interleaved.py" = ["F841"]  # bisect state vars used via closure
"agentsurge/cli/*.py" = ["T20"]  # CLI modules use print() for user-facing output
"agentsurge/runner.py" = ["E402"]  # late imports required by module structure
"examples/*.py" = ["T20"]  # example scripts use print() for demonstration
"scripts/*.py" = ["T20"]  # utility scripts use print() for output

[tool.ruff.lint.isort]
known-first-party = ["agentsurge"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "orjson", "transformers", "pandas"]
ignore_missing_imports = true
